<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Fruit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <!-- MENU AWAL -->
    <section id="startScreen" class="screen">
      <h1>🐍 SNAKE FRUIT</h1>
      <p>Makan buah sebanyak mungkin!</p>

      <input type="text" id="username" placeholder="Username" maxlength="20">
      <input type="tel" id="whatsapp" placeholder="Nomor WhatsApp" maxlength="15">

      <button id="startBtn">MULAI BERMAIN</button>

      <p id="errorMessage"></p>
    </section>

    <!-- GAME -->
    <section id="gameScreen" class="screen hidden">
      <div class="game-info">
        <span>👤 <b id="playerName"></b></span>
        <span>⭐ Skor: <b id="score">0</b></span>
      </div>

      <canvas id="gameCanvas" width="400" height="400"></canvas>

      <div class="controls">
        <button data-direction="up">⬆️</button>

        <div>
          <button data-direction="left">⬅️</button>
          <button data-direction="down">⬇️</button>
          <button data-direction="right">➡️</button>
        </div>
      </div>

      <button id="restartBtn">🔄 Main Lagi</button>
      <button id="leaderboardBtn">🏆 Leaderboard</button>
    </section>

    <!-- LEADERBOARD -->
    <section id="leaderboardScreen" class="screen hidden">
      <h2>🏆 LEADERBOARD</h2>

      <div id="leaderboardList">
        <p>Memuat data...</p>
      </div>

      <button id="backBtn">⬅️ Kembali</button>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
