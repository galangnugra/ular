<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Fruit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MENU AWAL -->
    <section id="startScreen" class="screen">
        <div class="card">
            <h1>🐍 Snake Fruit</h1>
            <p>Game Cacing Sederhana</p>

            <input type="text" id="username" placeholder="Masukkan username" maxlength="20">
            <input type="tel" id="whatsapp" placeholder="Nomor WhatsApp" maxlength="15">

            <button id="startBtn">🎮 Mulai Bermain</button>
            <button id="leaderboardBtn">🏆 Leaderboard</button>
        </div>
    </section>

    <!-- GAME -->
    <section id="gameScreen" class="screen hidden">
        <div class="game-container">
            <div class="top-bar">
                <span>👤 <b id="playerName">Player</b></span>
                <span>⭐ Score: <b id="score">0</b></span>
            </div>

            <canvas id="gameCanvas" width="360" height="360"></canvas>

            <div class="controls">
                <button data-direction="up">⬆️</button>
                <div>
                    <button data-direction="left">⬅️</button>
                    <button data-direction="down">⬇️</button>
                    <button data-direction="right">➡️</button>
                </div>
            </div>

            <button id="restartBtn">🔄 Main Lagi</button>
            <button id="backBtn">🏠 Menu Utama</button>
        </div>
    </section>

    <!-- LEADERBOARD -->
    <section id="leaderboardScreen" class="screen hidden">
        <div class="card leaderboard-card">
            <h1>🏆 Leaderboard</h1>

            <div id="leaderboardList"></div>

            <button id="backLeaderboardBtn">🏠 Kembali</button>
            <button id="clearDataBtn" class="danger">🗑️ Hapus Data</button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
